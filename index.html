<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5e8d6">
  <meta name="description" content="小流浪守护计划秋冬收集册，沿园区寻找小动物，扫码点亮收集。">
  <title>秋冬收集册</title>
  <style>
:root {
  color-scheme: light;
  --ink: #3f3529;
  --olive: #788044;
  --olive-dark: #5e6637;
  --paper: #fff4e6;
  --muted: #857862;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #ddd2bc; color: var(--ink); font: 15px/1.45 "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif; }
body.modal-open { overflow: hidden; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid #9a6634; outline-offset: 3px; }
.app-shell { max-width: 840px; min-height: 100dvh; margin: auto; overflow: hidden; background: radial-gradient(circle at 90% 8%, #f9eedb 0, transparent 30%), radial-gradient(circle at 12% 70%, #f4e6d0 0, transparent 35%), #f8ecdc; box-shadow: 0 15px 65px #655c4930; padding-bottom: env(safe-area-inset-bottom); padding-top: 12px; }
main { padding: 0 6% 18px; }
.hero { position: relative; padding-top: 14px; }
.hero-title { position: relative; width: fit-content; min-width: 52%; margin: 6px 0 20px 2.5%; padding: 8px 27px 11px 37px; transform: rotate(-1deg); color: #fff7e8; background: linear-gradient(95deg, #68743f, #798044 75%, #596b36); box-shadow: 5px 5px 0 #c7ae84, 0 8px 18px #9b7a5650; clip-path: polygon(0 8%, 3% 4%, 8% 6%, 12% 3%, 26% 5%, 38% 2%, 53% 5%, 67% 2%, 84% 6%, 96% 1%, 100% 10%, 99% 96%, 91% 98%, 75% 95%, 62% 100%, 48% 96%, 29% 99%, 15% 96%, 0 100%); font-size: clamp(30px, 5vw, 49px); letter-spacing: .16em; white-space: nowrap; }
.leaf { position: absolute; left: -5px; top: -5px; font-family: Arial, sans-serif; font-size: 53px; line-height: 1; transform: rotate(-27deg); filter: drop-shadow(3px 4px 2px #93744c50); }
.sprig { position: absolute; right: 3%; top: 9px; color: #8d9363; font-size: 64px; transform: rotate(-28deg); opacity: .8; }
.intro-row { display: grid; grid-template-columns: 25% 1fr; gap: 22px; align-items: center; margin-bottom: 15px; }
.intro-label { padding: 6px 8px; transform: rotate(-2deg); background: #e8cda7; box-shadow: 2px 2px 0 #ddbd93; text-align: center; font-size: clamp(18px, 3vw, 27px); font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.steps { border-left: 1px solid #8e806c; padding-left: 25px; margin: 0; list-style: none; font-size: clamp(13px, 2vw, 20px); letter-spacing: .05em; line-height: 1.65; }
.steps li { display: flex; gap: 11px; align-items: baseline; }
.steps b { display: grid; flex: none; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #89904d; color: white; font: italic 18px/1 Georgia, serif; }
.rules-link { display: block; width: 100%; padding: 7px 10px; border: 2px solid #929253; border-radius: 10px; color: #566031; background: #fff8ece6; text-align: center; font-size: clamp(16px, 2.8vw, 25px); font-weight: 700; letter-spacing: .08em; }
.rules-link span { margin-left: 11px; font-family: Arial, sans-serif; font-size: 26px; vertical-align: -2px; }
.alert { margin: 13px 0; padding: 10px 13px; border: 1px solid #c6ad78; border-radius: 8px; background: #fff4dc; color: #72543a; font-size: 13px; }
.album-stack { position: relative; margin: 24px 0 14px; padding: 9px; background: #dec4a0; box-shadow: 0 12px 18px #7b60402c; transform: rotate(.3deg); }
.album-stack:before { content: ""; position: absolute; inset: -6px 10px 9px -6px; z-index: 0; background: #e8d0ae; transform: rotate(-1.1deg); box-shadow: 0 2px 6px #8d74574d; }
.album { position: relative; padding: 20px 22px 14px; background: radial-gradient(circle at 25% 18%, #fff8edb0, transparent 35%), repeating-linear-gradient(20deg, #ffffff12 0 1px, transparent 1px 7px), #f8ead5; border: 2px solid #fff7e8; box-shadow: inset 0 0 0 1px #ddc7a5, 0 4px 12px #9c7b5559; clip-path: polygon(0 1%, 5% 0, 10% 1%, 15% 0, 23% 1%, 28% 0, 38% 1%, 48% 0, 57% 1%, 66% 0, 75% 1%, 83% 0, 93% 1%, 100% 0, 99% 10%, 100% 18%, 99% 27%, 100% 38%, 99% 49%, 100% 58%, 99% 70%, 100% 79%, 99% 90%, 100% 99%, 91% 100%, 84% 99%, 75% 100%, 64% 99%, 53% 100%, 42% 99%, 32% 100%, 22% 99%, 14% 100%, 5% 99%, 0 100%, 1% 90%, 0 79%, 1% 68%, 0 58%, 1% 48%, 0 36%, 1% 25%, 0 14%); }
.album-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); grid-template-rows: repeat(6, minmax(100px, 1fr)); gap: 3px 8px; }
.animal-slot { position: relative; display: grid; place-items: center; min-width: 0; min-height: 95px; padding: 13px 1px 3px; border: 0; background: transparent; }
.animal-slot:not(:disabled):hover .animal-art { transform: translateY(-3px) scale(1.03); }
.animal-slot:disabled { cursor: default; }
.slot-number { position: absolute; top: 0; left: 0; z-index: 2; min-width: 35px; padding: 1px 8px 2px; background: #ecd3ac; color: #5b432b; transform: rotate(-4deg); font: italic 17px/1.1 Georgia, serif; }
.animal-art { position: relative; display: grid; place-items: center; width: 100%; height: 100%; transition: transform .2s; }
.animal-art img { width: 100%; max-height: 125px; height: 100%; object-fit: contain; filter: grayscale(1) sepia(.45) brightness(.53) opacity(.3); }
.animal-slot.lit .animal-art img { filter: drop-shadow(0 2px 2px #77664c72) drop-shadow(2px 1px 0 #fff7ec) drop-shadow(-2px -1px 0 #fff7ec); }
.animal-slot.lit .animal-art:after { content: "✓"; position: absolute; right: 3px; bottom: 4px; display: grid; place-items: center; width: 25px; height: 25px; border: 3px solid #fff7e6; border-radius: 50%; background: #828d52; color: white; box-shadow: 0 2px 4px #6f624c66; font: bold 19px/1 Arial, sans-serif; }
.animal-slot.unknown .animal-art svg { width: 90%; height: 95%; max-height: 120px; fill: #aeb18a55; stroke: #838d63; stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.slot-name { position: absolute; bottom: -4px; max-width: 100%; padding: 1px 6px; border-radius: 3px; background: #fff3dfd9; color: #6f6047; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; }
.animal-slot:hover .slot-name, .animal-slot:focus-visible .slot-name { opacity: 1; }
.share-card { position: relative; grid-column: 2 / span 2; grid-row: 3 / span 2; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 9px 2px; padding: 12px; border: 10px solid #f8ecd9; box-shadow: 0 3px 8px #806c4e5a, inset 0 0 0 1px #d6c3a5; background: linear-gradient(135deg, #f5e5cf, #fff5e5); text-align: center; color: #403529; transform: rotate(-.8deg); }
.share-card:before { content: ""; position: absolute; top: -22px; left: 6%; width: 58px; height: 17px; background: #a3a96caa; transform: rotate(-21deg); }
.share-card strong { font-size: clamp(22px, 3.7vw, 34px); line-height: 1.25; letter-spacing: .1em; font-weight: 700; }
.share-card .camera { width: 51px; height: 48px; margin-top: 10px; color: #7b8650; }
.share-card small { display: block; margin-top: 7px; color: #72634c; font-size: 12px; }
.album-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; padding: 4px 5px 0; color: #554e3d; font-size: clamp(11px, 1.8vw, 16px); }
.legend { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
.legend i { display: inline-block; width: 16px; height: 16px; margin-right: 4px; border-radius: 50%; background: #8d985d; vertical-align: -3px; }
.legend .outline { border: 1px dashed #8d985d; background: transparent; }
.album-foot b { color: #7c854e; font: italic 21px Georgia, serif; white-space: nowrap; }
.album-hint { margin: 11px 4px 0; color: #7b705d; font-size: 12px; text-align: center; }
.reward-heading { display: flex; align-items: center; gap: 12px; margin: 22px 0 10px; }
.reward-heading h2 { flex: none; margin: 0; padding: 3px 22px 6px; color: white; background: #778047; clip-path: polygon(0 5%, 15% 0, 33% 5%, 50% 0, 68% 5%, 88% 0, 100% 7%, 99% 94%, 78% 100%, 60% 95%, 36% 100%, 13% 96%, 0 100%); font-size: clamp(22px, 3.5vw, 31px); letter-spacing: .08em; }
.reward-heading span { flex: none; padding: 2px 9px; background: #e9ceaa; font-size: 14px; }
.reward-heading:after { content: ""; width: 100%; border-top: 1px solid #c0b49d; }
.progress-track { position: relative; height: 96px; margin: 18px 1% 8px; }
.progress-rail { position: absolute; left: 4%; right: 4%; top: 44px; height: 12px; border-radius: 20px; background: #e3d4bd; box-shadow: inset 0 1px 3px #b6a184; }
.progress-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #829052, #6e7c40); box-shadow: 0 1px 3px #6f624c66; transition: width .4s ease; }
.progress-marker { display: none; }
.progress-node { position: absolute; top: 50px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; width: 66px; pointer-events: none; }
.pnode-dot { width: 18px; height: 18px; border: 3px solid #c9ae8a; border-radius: 50%; background: #fbf0e0; box-shadow: 0 1px 3px #b6a18499; }
.progress-node.reached .pnode-dot { border-color: #5e6a35; background: #7b874b; box-shadow: 0 1px 4px #5e6637aa; }
.progress-node.reached .pnode-dot:after { content: "✓"; display: grid; place-items: center; width: 100%; height: 100%; color: white; font: bold 11px/1 Arial, sans-serif; }
.pnode-label { margin-top: 7px; color: #6f6047; font-size: 12px; white-space: nowrap; }
.pnode-label b { font: italic 16px/1 Georgia, serif; color: #554e3d; }
.progress-node.reached .pnode-label { color: #5e6637; font-weight: 700; }
.pnode-gift { margin-top: 2px; }
.pnode-gift svg { width: 20px; height: 20px; color: #a89a7e; }
.progress-node.reached .pnode-gift svg { color: #7b874b; }
.reward-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px 18px; }
.reward-card { min-width: 0; padding: 9px 9px 11px; background: #fff5e6; border: 1px solid #e8d9c4; border-radius: 18px; box-shadow: 0 4px 7px #846e5540; text-align: center; }
.reward-photo { position: relative; height: clamp(125px, 25vw, 180px); overflow: hidden; border-radius: 12px; background: radial-gradient(circle at 30% 25%, #fff9ed, transparent 45%), linear-gradient(140deg, #e5cfb2, #e9d8c3 50%, #cdb495); }

.photo-key { background-position: 14.5% 75.5%; }
.photo-bag-only { background-position: 83.5% 75.5%; }
.photo-cup { background-position: 14.5% 91.5%; }
.photo-bundle { background-position: 83.5% 91.5%; }
.reward-photo .reward-art { display: none; }
.reward-photo:after { content: ""; position: absolute; inset: 0; border: 4px solid #ffffff55; border-radius: 12px; pointer-events: none; }
.reward-card h3 { margin: 5px 0 1px; font-size: clamp(15px, 2.4vw, 21px); font-weight: 700; line-height: 1.3; }
.reward-condition { display: inline-block; max-width: 100%; padding: 3px 14px; border-radius: 30px; background: #e5e1c1; color: #554c35; font-size: clamp(11px, 1.9vw, 15px); line-height: 1.25; }
.reward-art { position: absolute; inset: 0; display: grid; place-items: center; filter: drop-shadow(3px 10px 7px #574b3866); }
.keyring { position: relative; display: grid; place-items: center; width: 86px; height: 82px; border: 6px solid #f6eee1; border-radius: 23px 23px 30px 30px; background: linear-gradient(145deg, #fff8e9, #dec3a5); box-shadow: inset 0 0 0 2px #c3ac90; font-size: 52px; transform: rotate(-10deg) translateY(12px); }
.keyring:before { content: ""; position: absolute; top: -49px; left: 29px; width: 25px; height: 25px; border: 6px double #a99971; border-radius: 50%; }
.bag { position: relative; display: grid; place-items: center; width: 145px; height: 100px; margin-top: 32px; background: linear-gradient(130deg,#fff4e2,#dfcfb6); box-shadow: 0 0 0 2px #e5d2b7; color: #838f5d; }
.bag:before, .bag:after { content: ""; position: absolute; top: -32px; width: 26px; height: 38px; border: 8px solid #e8d8bc; border-bottom: 0; border-radius: 18px 18px 0 0; }
.bag:before { left: 20px; } .bag:after { right: 20px; }
.bag svg { width: 78px; height: 72px; }
.thermos { position: relative; display: grid; place-items: center; width: 76px; height: 133px; margin-top: 20px; border-radius: 14px 14px 21px 21px; background: linear-gradient(90deg,#5d694c,#89936b 32%,#707a57 80%,#4e5d46); box-shadow: inset 0 0 0 2px #4d5b46; color: #eee5ca; }
.thermos:before { content: ""; position: absolute; top: -15px; width: 64px; height: 27px; border-radius: 8px; background: #727e60; box-shadow: inset 0 0 0 2px #4f5d48; }
.thermos svg { width: 49px; height: 49px; }
.bundle .bag { transform: scale(.8) translate(-25px, 5px); }
.bundle .keyring { position: absolute; transform: scale(.48) rotate(10deg) translate(174px, 145px); }
.stickers { position: absolute; right: 9%; bottom: 10px; width: 52px; height: 90px; border: 3px solid #fff7e8; background: #f5ead8; color: #8c965f; transform: rotate(7deg); font: 28px/1.2 serif; }
.reward-note { margin: 12px 0 2px; color: #554b3a; text-align: center; font-size: 14px; letter-spacing: .04em; }
.reward-note small { display: block; margin-top: 4px; color: #8c7f6d; font-size: 12px; }
.demo-tools { margin: 24px 0 0; padding: 11px 4px; border-top: 1px solid #d5c1a5; color: #70634f; font-size: 12px; }
.demo-tools summary { cursor: pointer; font-weight: 700; }
.demo-tools p { margin: 7px 0; }
.demo-links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.demo-links a { padding: 9px; border: 1px solid #a5a66b; border-radius: 8px; background: #f1edd2; color: #4f5d35; text-align: center; text-decoration: none; font-weight: 700; }
.reset { padding: 7px 0; border: 0; background: none; color: #8a5846; text-decoration: underline; }
.loading { padding: 24px; }
footer { padding: 3px 7% 24px; color: #958673; text-align: center; font-size: 11px; }
.scan-sheet { position: fixed; z-index: 40; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; width: min(calc(100% - 24px), 540px); display: grid; grid-template-columns: 75px 1fr; gap: 7px 13px; padding: 12px; border: 2px solid #9b9b65; border-radius: 14px; background: #fff5e6; box-shadow: 0 15px 55px #322a2070; transform: translateX(-50%); }
.scan-sheet img { grid-row: 1 / 3; width: 75px; height: 88px; object-fit: contain; }
.scan-copy { display: flex; flex-direction: column; align-items: start; }
.scan-copy strong { font-size: 19px; } .scan-copy span { color: #766a57; font-size: 12px; } .scan-copy a { color: #59673d; font-size: 13px; font-weight: 700; }
.stay-button { justify-self: start; padding: 4px 10px; border: 1px solid #a2a577; border-radius: 7px; background: #e9e7cc; color: #515d36; font-size: 12px; }
.scan-sheet small { grid-column: 1 / -1; text-align: center; color: #857a69; }
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: #2c2a22bd; }
.modal { position: relative; width: min(100%, 520px); max-height: 90dvh; overflow: auto; padding: 24px; border: 7px solid #e4d0b1; background: #fff4e5; box-shadow: 0 20px 50px #2720187a; }
.modal h2 { margin: 0 35px 10px 0; font-size: 26px; }
.modal p { margin: 0 0 13px; color: #716550; font-size: 14px; }
.modal-close { position: absolute; top: 7px; right: 9px; width: 30px; height: 30px; border: 0; background: transparent; font-size: 25px; }
.hint-card { display: flex; align-items: center; gap: 12px; padding: 12px; margin: 14px 0; background: #ebe4cd; }
.hint-card img { width: 78px; height: 90px; object-fit: contain; }
.hint-card strong, .hint-card span { display: block; }
.hint-card span { color: #706650; font-size: 12px; }
.poster { display: block; width: 100%; max-height: 47dvh; margin: 12px 0; object-fit: contain; }
.button { display: grid; place-items: center; min-height: 43px; width: 100%; padding: 8px; border: 0; border-radius: 7px; background: #7d874d; color: #fff8e8; text-align: center; text-decoration: none; font-size: 14px; font-weight: 700; }
.rules-list { display: grid; gap: 12px; padding: 0; list-style: none; }
.rules-list li { display: flex; align-items: start; gap: 12px; }
.rules-list b { flex: none; padding: 4px 7px; background: #d9ddae; color: #526138; font-size: 12px; }
.rules-list span { color: #675d4c; font-size: 14px; }
.rules-note { padding: 11px; background: #efe5ce; }
@media (max-width: 600px) {
  main { padding: 0 4% 14px; }
  .progress-track { height: 84px; margin-top: 12px; }
  .progress-rail { top: 40px; }
  .progress-node { top: 46px; }
  .pnode-dot { width: 15px; height: 15px; border-width: 2px; }
  .pnode-label { font-size: 10px; }
  .pnode-label b { font-size: 14px; }
  .pnode-gift svg { width: 16px; height: 16px; }
  .hero-title { min-width: 70%; padding: 6px 13px 8px 30px; margin: 8px 0 18px 3%; font-size: clamp(25px, 7.4vw, 37px); }
  .leaf { font-size: 41px; left: -7px; }
  .sprig { font-size: 40px; right: 0; }
  .intro-row { gap: 9px; grid-template-columns: 27% 1fr; }
  .intro-label { font-size: 15px; padding: 5px 3px; }
  .steps { padding-left: 9px; font-size: clamp(11px, 2.9vw, 15px); letter-spacing: 0; }
  .steps li { gap: 5px; } .steps b { width: 17px; height: 17px; font-size: 13px; }
  .album { padding: 12px 8px 8px; }
  .album-grid { grid-template-rows: repeat(6, minmax(72px, 1fr)); gap: 0 3px; }
  .animal-slot { min-height: 72px; padding-top: 10px; }
  .animal-art img { max-height: 87px; }
  .animal-slot.unknown .animal-art svg { max-height: 86px; }
  .slot-number { min-width: 27px; padding: 1px 5px; font-size: 12px; }
  .animal-slot.lit .animal-art:after { width: 17px; height: 17px; border-width: 2px; font-size: 12px; }
  .share-card { margin: 5px 0; border-width: 6px; padding: 5px; }
  .share-card strong { font-size: clamp(15px, 4.5vw, 23px); }
  .share-card .camera { width: 33px; height: 31px; margin-top: 3px; }
  .share-card small { display: none; }
  .album-foot { font-size: 10px; } .legend { gap: 6px; } .legend i { width: 10px; height: 10px; margin-right: 2px; }
  .album-foot b { font-size: 14px; }
  .reward-grid { gap: 9px; }
  .reward-card { padding: 6px 6px 9px; }
  .reward-photo { height: 115px; }
  .keyring { transform: scale(.75) rotate(-10deg) translateY(12px); }
  .bag { transform: scale(.72) translateY(30px); }
  .thermos { transform: scale(.76) translateY(17px); }
  .bundle .bag { transform: scale(.58) translate(-30px, 15px); }
  .bundle .keyring { transform: scale(.33) rotate(10deg) translate(235px, 180px); }
  .stickers { transform: scale(.7) rotate(7deg) translate(22px, 20px); }
}
@media (max-width: 360px) {
  main { padding-inline: 3%; }
  .intro-label { font-size: 13px; }
  .steps { font-size: 10px; }
  .animal-slot { min-height: 64px; }
  .album-grid { grid-template-rows: repeat(6, minmax(65px, 1fr)); }
  .reward-condition { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .animal-art { transition: none; } }

    const collected = Array.isArray(saved.found) ? saved.found : [];
    const waiting = old && Array.isArray(saved.pending) ? saved.pending : [];
    found = [...new Set([...collected, ...waiting].filter(code => animals[code]))];
  } catch (_) {
    canSave = false;
  }
  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({ found }));
      canSave = true;
    } catch (_) {
      canSave = false;
    }
  }
  const isNew = Boolean(scannedAnimal && !found.includes(scannedCode));
  if (isNew) { found.push(scannedCode); save(); }
  else if (scannedAnimal) save();
  if (scannedCode) history.replaceState(null, "", location.pathname + location.hash);

  const catShape = '<svg viewBox="0 0 120 105" aria-hidden="true"><path d="M35 35 37 9 51 22Q62 17 74 23L87 8 88 38Q99 45 99 62Q99 78 83 82L84 94 29 94Q18 78 23 59Q26 44 35 35ZM85 82Q115 96 113 70Q112 59 104 57" /></svg>';
  const dogShape = '<svg viewBox="0 0 120 105" aria-hidden="true"><path d="M16 47Q22 29 35 34L43 15Q55 10 62 27L82 30Q99 27 103 42L108 70 101 74 99 91 85 91 82 73 51 74 48 92 33 92 29 66Q14 65 16 47ZM97 36Q116 26 115 16" /></svg>';
  const giftIcon = '<svg class="gift-icon" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h20v13H4zM3 9h22v4H3zM14 9v16M14 9C3 9 5 1 9 2c4 0 5 7 5 7Zm0 0c11 0 9-8 5-7-4 0-5 7-5 7Z"/></svg>';
  const petMark = '<svg viewBox="0 0 100 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 66Q13 28 34 25Q51 28 50 66M21 27 13 13 28 20M39 26 49 12 52 33M50 66Q52 44 71 43Q89 44 87 66M61 46 59 34 68 42M80 45 87 34 89 52M9 66h80M21 43h1M40 43h1M62 56h1M79 56h1"/></svg>';
  const camera = '<svg class="camera" viewBox="0 0 58 52" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" aria-hidden="true"><path d="M5 15h12l4-6h16l4 6h12v31H5z"/><circle cx="29" cy="30" r="10"/><path d="M45 8l3-4M51 14l5-2M48 21l5 2"/></svg>';
  const placement = n => {
    if (n <= 8) return { row: Math.ceil(n / 4), col: (n - 1) % 4 + 1 };
    if (n <= 12) return { row: 3 + (n % 2 === 0 ? 1 : 0), col: n <= 10 ? 1 : 4 };
    return { row: 5 + Math.floor((n - 13) / 4), col: (n - 13) % 4 + 1 };
  };
  function slot(n) {
    const code = slots[n], animal = animals[code], lit = Boolean(code && found.includes(code));
    const { row, col } = placement(n);
    const name = animal ? animal.name : "待加入的小动物";
    const art = animal ? '<img src="' + animal.image + '" alt="" loading="lazy">' : (n % 3 === 0 ? dogShape : catShape);
    return '<button type="button" class="animal-slot ' + (lit ? 'lit ' : '') + (animal ? 'known' : 'unknown') + '" style="grid-row:' + row + ';grid-column:' + col + '" ' +
      (code ? 'data-animal="' + code + '" aria-label="' + String(n).padStart(2, "0") + ' ' + name + '，' + (lit ? '已点亮，查看海报' : '待寻找，查看线索') + '"' : 'disabled aria-label="' + String(n).padStart(2, "0") + ' 待加入的小动物，示意位置"') + '>' +
      '<span class="slot-number">' + String(n).padStart(2, "0") + '</span><span class="animal-art">' + art + '</span><span class="slot-name">' + name + '</span></button>';
  }
  function prizeArt(type) {
    const keyring = '<div class="keyring" aria-hidden="true">🐈</div>';
    const bag = '<div class="bag" aria-hidden="true">' + petMark + '</div>';
    const thermos = '<div class="thermos" aria-hidden="true">' + petMark + '</div>';
    return '<div class="reward-photo photo-' + type + '"><div class="reward-art ' + type + '">' +
      (type === "key" ? keyring : type === "bag-only" ? bag : type === "cup" ? thermos : bag + keyring + '<div class="stickers" aria-hidden="true">♧ ♡<br>✿ ♧</div>') + '</div></div>';
  }
  const rewards = [
    { count: 5, title: "奖励一 · 动物钥匙扣", condition: "收集 5 只动物", art: "key" },
    { count: 10, title: "奖励二 · 守护帆布包", condition: "收集 10 只动物<br>＋发布小红书笔记", art: "bag-only" },
    { count: 15, title: "奖励三 · 随行保温杯", condition: "收集 15 只动物<br>＋发布小红书笔记", art: "cup" },
    { count: 20, title: "奖励四 · 全收集礼包", condition: "收集 20 只动物<br>＋发布小红书笔记", art: "bundle" }
  ];
  function render() {
    const count = found.length;
    app.innerHTML =
      '<section class="hero">' +
        '<span class="leaf" aria-hidden="true">🍁</span><span class="sprig" aria-hidden="true">❧</span>' +
        '<h1 class="hero-title">秋冬收集册</h1>' +
        '<div class="intro-row"><span class="intro-label">活动说明</span>' +
          '<ol class="steps"><li><b>1</b><span>沿园区路线寻找小动物；</span></li><li><b>2</b><span>扫描现场二维码，自动点亮收集；</span></li><li><b>3</b><span>按奖励条件完成任务，现场核验领奖。</span></li></ol></div>' +
        '<button class="rules-link" type="button" id="rules-link">查看完整活动说明 <span aria-hidden="true">›</span></button>' +
      '</section>' +
      (!canSave ? '<div class="alert">此浏览器暂时无法保存收集记录。请拍下纸板，现场可以由工作人员核验。</div>' : '') +
      (scannedCode && !scannedAnimal ? '<div class="alert">没有找到这只动物的收集入口，请重新扫描纸板二维码。</div>' : '') +
      '<section class="album-stack" aria-label="秋冬动物收集册"><div class="album">' +
        '<div class="album-grid">' + Array.from({ length: 20 }, (_, i) => slot(i + 1)).join('') +
          '<button type="button" class="share-card" id="share-card" aria-label="查看小红书分享方式"><strong>小红书<br>打卡位</strong>' + camera + '<small>记录你与 TA 的相遇</small></button></div>' +
        '<div class="album-foot"><span class="legend"><span><i></i> 已点亮</span><span><i class="outline"></i> 待寻找</span></span><span><b>' + count + ' / 20</b> · 布局示例</span></div>' +
      '</div></section>' +
      '<p class="album-hint">扫描纸板上的二维码即可点亮。已点亮的动物，点击可看海报与真实档案。</p>' +
      '<section class="rewards" aria-labelledby="reward-title"><div class="reward-heading"><h2 id="reward-title">收集奖励</h2><span>示例奖励</span></div>' +
        '<div class="progress-track" aria-label="收集进度 ' + count + '/20"><div class="progress-rail"><div class="progress-fill" style="width:' + Math.min(100, count / 20 * 100) + '%"></div></div>' +
          rewards.map((r, i) => '<div class="progress-node ' + (count >= r.count ? 'reached' : 'next') + '" style="left:' + (r.count / 20 * 100) + '%"><span class="pnode-dot"></span><span class="pnode-label"><b>' + r.count + '</b> 只</span><span class="pnode-gift">' + giftIcon + '</span></div>').join('') + '</div>' +
        '<div class="reward-grid">' + rewards.map(r => '<article class="reward-card">' + prizeArt(r.art) + '<h3>' + r.title + '</h3><span class="reward-condition">' + r.condition + '</span></article>').join('') + '</div>' +
        '<p class="reward-note">领取时请出示收集页，分享奖励另需出示小红书笔记。<small>奖品及门槛仅为示意，待活动确认。</small></p></section>' +
      '<details class="demo-tools"><summary>演示操作 · 体验四只已接入动物</summary><p>其余 16 格展示布局，尚未接入动物资料。点击下方链接模拟扫码。</p>' +
        '<div class="demo-links">' + codes.map(code => '<a href="?animalCode=' + code + '">扫描 ' + animals[code].name + '</a>').join('') + '</div>' +
        '<button class="reset" type="button" id="reset">清空这台设备的演示进度</button></details>';
    app.querySelectorAll("[data-animal]").forEach(button => button.addEventListener("click", () => openAnimal(button.dataset.animal)));
    app.querySelector("#rules-link").addEventListener("click", openRules);
    app.querySelector("#share-card").addEventListener("click", openShare);
    app.querySelector("#reset").addEventListener("click", () => {
      if (!confirm("清空这台设备的演示收集进度？")) return;
      stopRedirect(); found = []; save(); render();
    });
  }
  function stopRedirect() {
    if (redirectTimer) clearTimeout(redirectTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    redirectTimer = countdownTimer = null;
  }
  function closeModal() { modalRoot.innerHTML = ""; document.body.classList.remove("modal-open"); }
  function showModal(content) {
    closeModal();
    modalRoot.innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" type="button" aria-label="关闭">×</button>' + content + '</div></div>';
    document.body.classList.add("modal-open");
    modalRoot.querySelector(".modal-close").addEventListener("click", closeModal);
    modalRoot.querySelector(".overlay").addEventListener("click", e => { if (e.target.classList.contains("overlay")) closeModal(); });
    modalRoot.querySelector(".modal-close").focus();
  }
  function openAnimal(code) {
    const animal = animals[code];
    if (!found.includes(code)) {
      showModal('<h2 id="modal-title">还没遇见 ' + animal.name + '</h2><p>在园区找到 TA 的纸板，扫描上面的二维码，就能自动点亮。</p>' +
        '<div class="hint-card"><img src="' + animal.image + '" alt=""><div><strong>' + animal.name + '</strong><span>' + animal.line + '</span></div></div>' +
        '<button class="button" type="button" id="modal-done">继续寻找</button>');
      modalRoot.querySelector("#modal-done").addEventListener("click", closeModal);
      return;
    }
    showModal('<h2 id="modal-title">你遇见了 ' + animal.name + '</h2><p>' + animal.line + '。看看海报，再进入小流浪档案了解更多。</p>' +
      '<img class="poster" src="' + animal.poster + '" alt="' + animal.name + ' 的分享海报">' +
      '<a class="button" href="' + animal.detail + '">认识真实的 ' + animal.name + ' ›</a>');
  }
  function openRules() {
    showModal('<h2 id="modal-title">活动说明</h2><ol class="rules-list">' +
      '<li><b>寻找</b><span>在园区遇见纸板动物，每只动物的二维码各计一次。</span></li>' +
      '<li><b>收集</b><span>扫码进入收集册即自动点亮，随后会进入这只动物的小流浪详情页。返回收集册可继续寻找。</span></li>' +
      '<li><b>分享</b><span>拍下遇见的动物，挑一只想介绍的 TA，发布小红书笔记。</span></li>' +
      '<li><b>领奖</b><span>到活动照片墙出示收集页；分享奖励另出示已发布的笔记。由工作人员现场核验。</span></li></ol>' +
      '<p class="rules-note">页面中的 20 格、奖品和门槛为展示示意。最终参与方式以活动公布为准。</p>' +
      '<button class="button" type="button" id="modal-done">知道了</button>');
    modalRoot.querySelector("#modal-done").addEventListener("click", closeModal);
  }
  function openShare() {
    showModal('<h2 id="modal-title">小红书打卡</h2><p>拍下你遇见的纸板动物，介绍一位让你印象深刻的小流浪。可以写写在哪里遇见了 TA、它有什么特别之处，以及它的真实档案链接。</p>' +
      '<p class="rules-note">发布后保留笔记页面。到照片墙领取分享奖励时，向工作人员出示收集页和已发布的笔记。</p>' +
      '<button class="button" type="button" id="modal-done">继续收集</button>');
    modalRoot.querySelector("#modal-done").addEventListener("click", closeModal);
  }
  function showScanResult() {
    if (!scannedAnimal) return;
    let seconds = 3;
    const sheet = document.createElement("div");
    sheet.className = "scan-sheet";
    sheet.setAttribute("role", "status");
    sheet.innerHTML = '<img src="' + scannedAnimal.image + '" alt=""><div class="scan-copy"><strong>' +
      (isNew ? '找到 ' : '又遇见 ') + scannedAnimal.name + '！</strong><span>' +
      (isNew ? '已经收集 ' + found.length + ' 只小流浪' : '这只已点亮，收集总数仍是 ' + found.length + ' 只') +
      '</span><a href="' + scannedAnimal.detail + '" id="go-now">立即认识 TA ›</a></div>' +
      '<button type="button" class="stay-button" id="stay-here">留在收集页</button><small id="scan-countdown">3 秒后进入详情</small>';
    document.body.append(sheet);
    sheet.querySelector("#stay-here").addEventListener("click", () => { stopRedirect(); sheet.remove(); });
    sheet.querySelector("#go-now").addEventListener("click", stopRedirect);
    countdownTimer = setInterval(() => {
      seconds -= 1;
      const label = sheet.querySelector("#scan-countdown");
      if (label && seconds > 0) label.textContent = seconds + " 秒后进入详情";
    }, 1000);
    redirectTimer = setTimeout(() => { stopRedirect(); location.assign(scannedAnimal.detail); }, 3000);
  }
  render();
  showScanResult();
  addEventListener("pagehide", () => { stopRedirect(); document.querySelector(".scan-sheet")?.remove(); });
  addEventListener("pageshow", event => { if (event.persisted) document.querySelector(".scan-sheet")?.remove(); });
  document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });
})();

</script>
</body>
</html>
